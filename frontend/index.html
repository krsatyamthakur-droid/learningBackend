<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auth website</title>
<script src="https://cdn.jsdelivr.net/npm/axios@1.13.2/dist/axios.min.js"></script>
<script>
   async function signup(){


        const username=document.getElementById("signup_username").value
        const password=document.getElementById("signup_password").value
       await axios.post("http://localhost:2000/signup",{
            username:username,
            password:password
        });
        alert('you are signed in ')
    }
   async function signin(){
    const username=document.getElementById('signin_username').value
    const password=document.getElementById('sign_password').value
    const response=await axios.post('http://localhost:2000/signin',{
        username:username,
        password:password
    });
    localStorage.setItem('token',response.data.token)
    
   }
   async function getuserfunction(){
   const response= await axios.get('http://localhost:2000/me',{
        headers:{
            token:localStorage.getItem("token")
        }
    })
    document.getElementById('information').innerHTML='username:' + response.data.username +'password :'+response.data.password
   }
   getuserfunction()
   function logout(){
    localStorage.removeItem("tokenç")
   }
</script>
</head>

<body>
    <div>
        signup
        <input type="text" name="username" id="signup_username" placeholder="username">
        <input type="text" name="password" id="signup_password" placeholder="password">
        <button onclick="signup()">submit</button>
    </div>
    signin
        <input type="text" name="username" id="signin_username" placeholder="username">
        <input type="text" name="password" id="sign_password" placeholder="password">
        <button onclick="signin()">submit</button>
    </div>
    <div>
        user information
        <div id="information"></div>
    </div>
    <button onclick="logout()">logout</button>
</body>
</html>
